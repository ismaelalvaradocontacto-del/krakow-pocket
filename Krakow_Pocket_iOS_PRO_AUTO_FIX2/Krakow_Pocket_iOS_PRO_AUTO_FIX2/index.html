<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f6f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pocket">
  <meta name="format-detection" content="telephone=no">
  <title>Pocket · Tus páginas</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./pocket-icon-192.svg">
  <link rel="stylesheet" href="./hub.css?v=20260830a">
</head>
<body>
  <main class="hub-shell">
    <header class="hub-header">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true">P</div>
        <div class="brand-copy">
          <div class="eyebrow">TU ESPACIO</div>
          <h1>Pocket</h1>
        </div>
      </div>
      <p class="intro">Páginas útiles, siempre a mano. Viajes, planes, herramientas o cualquier cosa que quieras convertir en algo práctico.</p>
    </header>

    <section class="hub-tools" aria-label="Buscar y filtrar páginas">
      <label class="search-wrap" for="pageSearch">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
        <input id="pageSearch" type="search" inputmode="search" autocomplete="off" placeholder="Buscar en Pocket">
      </label>
      <div class="filters" id="categoryFilters" aria-label="Categorías"></div>
    </section>

    <section class="pages-section" aria-labelledby="pagesHeading">
      <div class="section-head">
        <div>
          <div class="eyebrow">MÁS RECIENTE PRIMERO</div>
          <h2 id="pagesHeading">Tus páginas</h2>
        </div>
        <span class="page-count" id="pageCount" aria-live="polite"></span>
      </div>
      <div class="page-list" id="pageList"></div>
      <div class="empty-state" id="emptyState" hidden>
        <strong>No encuentro esa página</strong>
        <span>Prueba con otro nombre o categoría.</span>
      </div>
    </section>

    <footer class="hub-footer">Lo último que añadamos aparecerá automáticamente arriba.</footer>
  </main>

  <script src="./pages.js?v=20260830a"></script>
  <script src="./hub.js?v=20260830a"></script>
</body>
</html>
