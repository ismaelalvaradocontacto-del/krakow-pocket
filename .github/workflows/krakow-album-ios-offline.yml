name: Krakow Pocket iPhone offline album audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  offline-album:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static offline compatibility checks
        run: |
          set -euxo pipefail
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          node --check "$APP_DIR/album-experience.js"
          node --check "$APP_DIR/album-v3-polish.js"
          node --check "$APP_DIR/album-ios-compat.js"
          node --check "$APP_DIR/album-digital-v4.js"
          node --check "$APP_DIR/album-digital-v4-runtime-fix.js"
          node --check .github/scripts/krakow-album-ios-offline.mjs
          grep -q 'const VERSION = "3.0"' "$APP_DIR/album-experience.js"
          grep -q 'const VERSION="1.0"' "$APP_DIR/album-v3-polish.js"
          grep -q 'const VERSION = "1.1"' "$APP_DIR/album-ios-compat.js"
          grep -q 'const VERSION = "4.0"' "$APP_DIR/album-digital-v4.js"
          grep -q 'directIframeMount:true' "$APP_DIR/album-digital-v4-runtime-fix.js"
          grep -q 'noJsNavigation: true' "$APP_DIR/album-ios-compat.js"
          grep -q 'quickLookCompatible: true' "$APP_DIR/album-ios-compat.js"
          grep -q 'stableAnchorNavigation: true' "$APP_DIR/album-ios-compat.js"
          grep -q 'noJsCompatible: true' "$APP_DIR/album-digital-v4.js"
          grep -q 'data-kp-offline-compat' "$APP_DIR/album-experience.js"
          grep -q 'albumOfflineCompat: true' "$APP_DIR/stability.js"
          grep -q 'digitalAlbumV4: true' "$APP_DIR/stability.js"
          grep -q 'digitalAlbumRuntimeStable: true' "$APP_DIR/stability.js"
          grep -q 'album-digital-v4-runtime-fix.js' "$APP_DIR/sw.js"
          grep -q 'krakow-pocket-v44-digital-album-stable-20260812a' "$APP_DIR/sw.js"
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0 >/tmp/npm-playwright.log 2>&1
          npx playwright install --with-deps chromium webkit >/tmp/playwright-install.log 2>&1
      - name: Start local app
        run: |
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$APP_DIR" >/tmp/kp-offline-album-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4173/album-experience.js | grep -q 'const VERSION = "3.0"'
          curl -fsS http://127.0.0.1:4173/album-digital-v4-runtime-fix.js | grep -q 'directIframeMount:true'
      - name: Verify no-JS album controls locally
        run: node .github/scripts/krakow-album-ios-offline.mjs
      - name: Wait for Cloudflare build
        run: |
          for i in {1..45}; do
            ALBUM=0; POLISH=0; COMPAT=0; DIGITAL=0; RUNTIME=0; CACHE=0
            curl -fsS https://krakow-pocket.pages.dev/album-experience.js | grep -q 'const VERSION = "3.0"' && ALBUM=1 || true
            curl -fsS https://krakow-pocket.pages.dev/album-v3-polish.js | grep -q 'mobileToolbarFits:true' && POLISH=1 || true
            curl -fsS https://krakow-pocket.pages.dev/album-ios-compat.js | grep -q 'stableAnchorNavigation: true' && COMPAT=1 || true
            curl -fsS https://krakow-pocket.pages.dev/album-digital-v4.js | grep -q 'const VERSION = "4.0"' && DIGITAL=1 || true
            curl -fsS https://krakow-pocket.pages.dev/album-digital-v4-runtime-fix.js | grep -q 'directIframeMount:true' && RUNTIME=1 || true
            curl -fsS https://krakow-pocket.pages.dev/sw.js | grep -q 'krakow-pocket-v44-digital-album-stable-20260812a' && CACHE=1 || true
            if [ "$ALBUM" = "1" ] && [ "$POLISH" = "1" ] && [ "$COMPAT" = "1" ] && [ "$DIGITAL" = "1" ] && [ "$RUNTIME" = "1" ] && [ "$CACHE" = "1" ]; then
              echo "Cloudflare is serving digital album v4 direct-runtime with iPhone offline compatibility"
              exit 0
            fi
            sleep 4
          done
          exit 1
      - name: Verify no-JS album controls on Cloudflare
        env:
          KP_AUDIT_URL: https://krakow-pocket.pages.dev/
        run: node .github/scripts/krakow-album-ios-offline.mjs
