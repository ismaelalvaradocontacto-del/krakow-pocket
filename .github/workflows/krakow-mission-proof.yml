name: Krakow Pocket verified missions audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verified-missions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Static verified mission checks
        run: |
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          node --check "$APP_DIR/mission-proof.js"
          node --check "$APP_DIR/mission-proof-guard.js"
          node --check "$APP_DIR/state-bridge.js"
          node --check .github/scripts/krakow-mission-proof.mjs
          grep -q 'version:VERSION,requiresPhoto:true,requiresProximity:true' "$APP_DIR/mission-proof.js"
          grep -q 'storesExactCoordinates:false' "$APP_DIR/mission-proof.js"
          grep -q 'albumDownload:true' "$APP_DIR/mission-proof.js"
          grep -q 'animatedComments:true' "$APP_DIR/mission-proof.js"
          grep -q 'hardGate:true' "$APP_DIR/mission-proof-guard.js"
          grep -q 'sharedMissionEvidence: true' "$APP_DIR/state-bridge.js"
          grep -q 'mission-proof.js?v=20260811b' "$APP_DIR/state-bridge.js"
          grep -q 'mission-proof-guard.js?v=20260811a' "$APP_DIR/state-bridge.js"
          grep -q 'krakow-pocket-v36-mission-proof-guard-20260811a' "$APP_DIR/sw.js"
          grep -q './mission-proof.js' "$APP_DIR/sw.js"
          grep -q './mission-proof-guard.js' "$APP_DIR/sw.js"

      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0 >/tmp/npm-playwright.log 2>&1
          npx playwright install --with-deps chromium webkit >/tmp/playwright-install.log 2>&1

      - name: Start local app
        run: |
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$APP_DIR" >/tmp/krakow-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4173/mission-proof.js | grep -q 'requiresPhoto:true'
          curl -fsS http://127.0.0.1:4173/mission-proof-guard.js | grep -q 'hardGate:true'

      - name: Verify GPS photo missions and album locally
        run: node .github/scripts/krakow-mission-proof.mjs

      - name: Wait for Cloudflare build
        run: |
          for i in {1..60}; do
            PROOF=0; GUARD=0; BRIDGE=0; CACHE=0
            curl -fsS https://krakow-pocket.pages.dev/mission-proof.js | grep -q 'const VERSION="1.1"' && PROOF=1 || true
            curl -fsS https://krakow-pocket.pages.dev/mission-proof-guard.js | grep -q 'hardGate:true' && GUARD=1 || true
            curl -fsS https://krakow-pocket.pages.dev/state-bridge.js | grep -q 'sharedMissionEvidence: true' && BRIDGE=1 || true
            curl -fsS https://krakow-pocket.pages.dev/sw.js | grep -q 'krakow-pocket-v36-mission-proof-guard-20260811a' && CACHE=1 || true
            if [ "$PROOF" = "1" ] && [ "$GUARD" = "1" ] && [ "$BRIDGE" = "1" ] && [ "$CACHE" = "1" ]; then
              echo "Cloudflare verified mission build is live"
              exit 0
            fi
            sleep 5
          done
          echo "Cloudflare verified mission build did not update in time"
          exit 1

      - name: Verify GPS photo missions and album on Cloudflare
        env:
          KP_AUDIT_URL: https://krakow-pocket.pages.dev/
        run: node .github/scripts/krakow-mission-proof.mjs
