name: Transferencia · prueba PDF

on:
  push:
    branches: [main]
    paths:
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/vehiculos*'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/scripts/test-vehiculos.mjs'
      - '.github/workflows/transferencia-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias de prueba
        run: npm install --no-save pdf-lib@1.17.1 jsdom@24.1.3

      - name: Generar y validar los PDF
        run: node Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/scripts/test-vehiculos.mjs
