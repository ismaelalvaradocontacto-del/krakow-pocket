name: Krakow Pocket final album v5 audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  album-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Static Album V5 integrity
        run: |
          set -euxo pipefail
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          node --check "$APP_DIR/album-v5.js"
          node --check "$APP_DIR/album-next.js"
          node --check "$APP_DIR/mission-proof.js"
          node --check "$APP_DIR/auschwitz-extra.js"
          node --check "$APP_DIR/state-bridge.js"
          node --check "$APP_DIR/stability.js"
          node --check "$APP_DIR/album-photo-quality.js"
          node --check .github/scripts/krakow-album-v5-final-audit-r2.mjs
          grep -q 'const VERSION="2.0"' "$APP_DIR/mission-proof.js"
          grep -q 'legacyAlbumUi:false' "$APP_DIR/mission-proof.js"
          grep -q 'legacyAlbumExporter:false' "$APP_DIR/mission-proof.js"
          grep -q 'const VERSION="2.0"' "$APP_DIR/auschwitz-extra.js"
          grep -q 'legacyAlbumExporter:false' "$APP_DIR/auschwitz-extra.js"
          grep -q 'version: "1.8"' "$APP_DIR/state-bridge.js"
          grep -q 'remoteEvidenceAbsorbedBeforeAppMerge: true' "$APP_DIR/state-bridge.js"
          grep -q 'outgoingEvidenceTimestampGuard: true' "$APP_DIR/state-bridge.js"
          grep -q 'staleMissionEvidenceSurvivesReload: true' "$APP_DIR/state-bridge.js"
          grep -q 'sharedAlbumPhotos: true' "$APP_DIR/state-bridge.js"
          grep -q 'version: "3.1"' "$APP_DIR/stability.js"
          grep -q 'albumIframePagehideCapture: true' "$APP_DIR/stability.js"
          grep -q 'albumIframeGuardRevision: "20260812b"' "$APP_DIR/stability.js"
          grep -q 'pdfWaitsForFrame:true' "$APP_DIR/album-v5.js"
          grep -q 'safariScrollRestore:true' "$APP_DIR/album-v5.js"
          grep -q 'const VERSION="6.0"' "$APP_DIR/album-next.js"
          grep -q 'multiPhoto:true' "$APP_DIR/album-next.js"
          grep -q 'krakow-pocket-v50-album-multi-20260812a' "$APP_DIR/sw.js"

      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0 >/tmp/npm-playwright.log 2>&1
          npx playwright install --with-deps chromium webkit >/tmp/playwright-install.log 2>&1

      - name: Start local production mirror
        run: |
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$APP_DIR" >/tmp/kp-album-v5-http.log 2>&1 &
          sleep 2

      - name: Exhaustive Album V5 audit locally
        run: node .github/scripts/krakow-album-v5-final-audit-r2.mjs

      - name: Wait for exact Cloudflare deployment
        run: |
          for i in {1..60}; do
            V5=0; NEXT=0; PROOF=0; AUS=0; BRIDGE=0; STABLE=0; CACHE=0
            curl -fsS https://krakow-pocket.pages.dev/album-v5.js | grep -q 'pdfWaitsForFrame:true' && V5=1 || true
            curl -fsS https://krakow-pocket.pages.dev/album-next.js | grep -q 'const VERSION="6.0"' && NEXT=1 || true
            curl -fsS https://krakow-pocket.pages.dev/mission-proof.js | grep -q 'const VERSION="2.0"' && PROOF=1 || true
            curl -fsS https://krakow-pocket.pages.dev/auschwitz-extra.js | grep -q 'const VERSION="2.0"' && AUS=1 || true
            curl -fsS https://krakow-pocket.pages.dev/state-bridge.js | grep -q 'version: "1.8"' && BRIDGE=1 || true
            curl -fsS https://krakow-pocket.pages.dev/stability.js | grep -q 'albumIframeGuardRevision: "20260812b"' && STABLE=1 || true
            curl -fsS https://krakow-pocket.pages.dev/sw.js | grep -q 'krakow-pocket-v50-album-multi-20260812a' && CACHE=1 || true
            if [ "$V5" = 1 ] && [ "$NEXT" = 1 ] && [ "$PROOF" = 1 ] && [ "$AUS" = 1 ] && [ "$BRIDGE" = 1 ] && [ "$STABLE" = 1 ] && [ "$CACHE" = 1 ]; then exit 0; fi
            sleep 4
          done
          exit 1

      - name: Exhaustive Album V5 audit on Cloudflare
        env:
          KP_AUDIT_URL: https://krakow-pocket.pages.dev/
        run: node .github/scripts/krakow-album-v5-final-audit-r2.mjs

      - name: Upload final diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: album-v5-final-audit-r2
          path: /tmp/album-v5-final-audit-r2.json
          if-no-files-found: ignore
