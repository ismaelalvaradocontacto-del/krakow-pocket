name: Transferencia · importar PDFs binarios

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transferencia-binary-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Descargar plantillas originales
        env:
          URL_MANDATO: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-e45c-8210-8173-2b33023858fe/raw?se=2026-08-31T03%3A30%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=b5906388-6886-5365-9446-d7225d4da8c2&skoid=0a4a0f0c-99ac-4752-9d87-cfac036fa93f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-30T17%3A39%3A51Z&ske=2026-08-31T17%3A39%3A51Z&sks=b&skv=2026-02-06&sig=0mB1b9BJPJxbCMyeMXPCZX4noGMIuvSShofIQG5AJEU%3D"
          URL_PARTICULARES: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-55d4-8210-a07e-c1eeea1edab1/raw?se=2026-08-31T03%3A31%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=daa93c75-f03d-5053-b12c-be23e9dd67ab&skoid=0a4a0f0c-99ac-4752-9d87-cfac036fa93f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-30T16%3A44%3A55Z&ske=2026-08-31T16%3A44%3A55Z&sks=b&skv=2026-02-06&sig=ZjmxZcWRZQJ5lWDGdRdcHYELW2Ed7cefGaCysqwWmCA%3D"
          URL_REHAB: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-8d74-8210-831e-a9b1f557c80b/raw?se=2026-08-31T03%3A30%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=6756a7e1-aa3e-55ba-baf4-c399a3145670&skoid=0a4a0f0c-99ac-4752-9d87-cfac036fa93f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-30T17%3A36%3A15Z&ske=2026-08-31T17%3A36%3A15Z&sks=b&skv=2026-02-06&sig=rmyEenfCy3rhmCT5y%2BpP3aAhVMWYac9JTjQFtLw7cu0%3D"
        run: |
          set -euo pipefail
          APP='Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2'
          mkdir -p "$APP/assets/vehiculos"
          curl -fL --retry 2 "$URL_MANDATO" -o "$APP/assets/vehiculos/mandato.pdf"
          curl -fL --retry 2 "$URL_PARTICULARES" -o "$APP/assets/vehiculos/contrato-particulares.pdf"
          curl -fL --retry 2 "$URL_REHAB" -o "$APP/assets/vehiculos/contrato-rehabilitacion.pdf"
          echo 'eef564a0880b1ee913456315bb7304df9410fd71be9066cc5de0eee4f39138c0  '"$APP"'/assets/vehiculos/mandato.pdf' | sha256sum -c -
          echo '77048a0ebdf6933a549563a92045cba0db79d9f32e98e986940ab11ba6ba1d56  '"$APP"'/assets/vehiculos/contrato-particulares.pdf' | sha256sum -c -
          echo '71c3e964b7cc934df797d1bb321f354eb068d62b3ebf76936c8b67c74b2fc82b  '"$APP"'/assets/vehiculos/contrato-rehabilitacion.pdf' | sha256sum -c -

      - name: Guardar binarios y retirar importador
        run: |
          set -euo pipefail
          git config user.name 'Pocket Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/assets/vehiculos/*.pdf
          git rm .github/workflows/transferencia-binary-import.yml
          git commit -m 'Guarda plantillas PDF originales de Transferencia'
          git push
