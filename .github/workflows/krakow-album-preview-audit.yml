name: Krakow Pocket album preview audit

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/krakow-album-preview-audit.mjs'
      - '.github/workflows/krakow-album-preview-audit.yml'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-v5.js'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-next.js'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/stability.js'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/styles.css'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/storybook.css'
  workflow_dispatch:

concurrency:
  group: krakow-album-preview-main
  cancel-in-progress: true

jobs:
  preview-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static preview audit
        run: |
          set -euxo pipefail
          APP_DIR='Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2'
          node --check "$APP_DIR/album-v5.js"
          node --check "$APP_DIR/album-next.js"
          node --check .github/scripts/krakow-album-preview-audit.mjs
          grep -q 'frame.srcdoc=html()' "$APP_DIR/album-next.js"
          grep -q 'data-kp-album-v5' "$APP_DIR/album-v5.js"
      - name: Install browser engines
        run: |
          npm install --no-save playwright@1.55.0 >/tmp/npm-playwright.log 2>&1
          npx playwright install --with-deps chromium webkit >/tmp/playwright-install.log 2>&1
      - name: Start local build
        run: |
          APP_DIR='Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2'
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$APP_DIR" >/tmp/kp-preview-http.log 2>&1 &
          sleep 2
      - name: Audit local preview
        env:
          KP_AUDIT_LABEL: local
          KP_AUDIT_OUT: /tmp/album-preview-audit
        run: node .github/scripts/krakow-album-preview-audit.mjs
      - name: Wait for deployed album controller
        run: |
          for i in {1..60}; do
            curl -fsS https://krakow-pocket.pages.dev/album-next.js | grep -q 'const VERSION="6.1"' && exit 0 || true
            sleep 4
          done
          exit 1
      - name: Audit deployed preview
        env:
          KP_AUDIT_URL: https://krakow-pocket.pages.dev/
          KP_AUDIT_LABEL: cloudflare
          KP_AUDIT_OUT: /tmp/album-preview-audit
        run: node .github/scripts/krakow-album-preview-audit.mjs
      - name: Upload preview reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: album-preview-audit
          path: /tmp/album-preview-audit/*
          if-no-files-found: ignore
          retention-days: 14
