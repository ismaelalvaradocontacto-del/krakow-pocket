name: Krakow Pocket album preview audit

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/krakow-album-preview-audit.mjs'
      - '.github/scripts/krakow-mission-photo-replace.mjs'
      - '.github/workflows/krakow-album-preview-audit.yml'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-v5.js'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-next.js'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/mission-proof.js'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/mission-proof-guard.js'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/mission-fix.js'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-photo-quality.js'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/app.js'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/enhancements.js'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/stability.js'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/styles.css'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/storybook.css'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/sw.js'
  workflow_dispatch:

concurrency:
  group: krakow-album-preview-main
  cancel-in-progress: true

jobs:
  preview-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static preview, quota and replacement audit
        run: |
          set -euxo pipefail
          APP_DIR='Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2'
          node --check "$APP_DIR/album-v5.js"
          node --check "$APP_DIR/album-next.js"
          node --check "$APP_DIR/mission-proof.js"
          node --check "$APP_DIR/mission-proof-guard.js"
          node --check "$APP_DIR/mission-fix.js"
          node --check "$APP_DIR/album-photo-quality.js"
          node --check "$APP_DIR/app.js"
          node --check "$APP_DIR/enhancements.js"
          node --check "$APP_DIR/sw.js"
          node --check .github/scripts/krakow-album-preview-audit.mjs
          node --check .github/scripts/krakow-mission-photo-replace.mjs
          grep -q 'const VERSION="6.2"' "$APP_DIR/album-next.js"
          grep -q 'controllerRevision:"20260813c"' "$APP_DIR/album-next.js"
          grep -q 'intentionalReplacementSkipsArchive:true' "$APP_DIR/album-next.js"
          grep -q 'replacementArchiveGuardByEntry:true' "$APP_DIR/album-next.js"
          grep -q 'isolatedPreviewGuard:true' "$APP_DIR/album-next.js"
          grep -q 'KP_ALBUM_DOCUMENT_FACTORY' "$APP_DIR/album-v5.js"
          grep -q 'const VERSION="2.2"' "$APP_DIR/mission-proof.js"
          grep -q 'replaceCompletedPhoto:true' "$APP_DIR/mission-proof.js"
          grep -q 'replaceOnly:wasReplace' "$APP_DIR/mission-proof.js"
          grep -q 'replaceCompletedPhoto:true' "$APP_DIR/mission-proof-guard.js"
          grep -q 'version: "4.3"' "$APP_DIR/mission-fix.js"
          grep -q '📷 Cambiar foto' "$APP_DIR/mission-fix.js"
          grep -q '📷 Cambiar foto' "$APP_DIR/app.js"
          grep -q 'version:"7.1"' "$APP_DIR/enhancements.js"
          grep -q 'completedMissionPhotoReplacement:true' "$APP_DIR/enhancements.js"
          grep -q '📷 Cambiar foto' "$APP_DIR/enhancements.js"
          grep -q 'const VERSION = "1.1"' "$APP_DIR/album-photo-quality.js"
          grep -q 'SOFT_STATE_LIMIT = 2600000' "$APP_DIR/album-photo-quality.js"
          grep -q 'krakow-pocket-v65-photo-replace-20260813b' "$APP_DIR/sw.js"
          grep -q 'self.skipWaiting' "$APP_DIR/sw.js"
      - name: Install browser engines
        run: |
          npm install --no-save playwright@1.55.0 >/tmp/npm-playwright.log 2>&1
          npx playwright install --with-deps chromium webkit >/tmp/playwright-install.log 2>&1
      - name: Start local build
        run: |
          APP_DIR='Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2'
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$APP_DIR" >/tmp/kp-preview-http.log 2>&1 &
          sleep 2
      - name: Audit local preview
        env:
          KP_AUDIT_LABEL: local
          KP_AUDIT_OUT: /tmp/album-preview-audit
        run: node .github/scripts/krakow-album-preview-audit.mjs
      - name: Test local completed mission photo replacement
        env:
          KP_AUDIT_LABEL: local
        run: node .github/scripts/krakow-mission-photo-replace.mjs
      - name: Wait for deployed completed-photo replacement
        run: |
          for i in {1..60}; do
            A=0; M=0; G=0; X=0; U=0; B=0; S=0
            curl -fsS https://krakow-pocket.pages.dev/album-next.js | grep -q 'replacementArchiveGuardByEntry:true' && A=1 || true
            curl -fsS https://krakow-pocket.pages.dev/mission-proof.js | grep -q 'const VERSION="2.2"' && M=1 || true
            curl -fsS https://krakow-pocket.pages.dev/mission-proof-guard.js | grep -q 'replaceCompletedPhoto:true' && G=1 || true
            curl -fsS https://krakow-pocket.pages.dev/enhancements.js | grep -q 'version:"7.1"' && X=1 || true
            curl -fsS https://krakow-pocket.pages.dev/mission-fix.js | grep -q 'version: "4.3"' && U=1 || true
            curl -fsS https://krakow-pocket.pages.dev/app.js | grep -q '📷 Cambiar foto' && B=1 || true
            curl -fsS https://krakow-pocket.pages.dev/sw.js | grep -q 'krakow-pocket-v65-photo-replace-20260813b' && S=1 || true
            if [ "$A" = 1 ] && [ "$M" = 1 ] && [ "$G" = 1 ] && [ "$X" = 1 ] && [ "$U" = 1 ] && [ "$B" = 1 ] && [ "$S" = 1 ]; then exit 0; fi
            sleep 4
          done
          exit 1
      - name: Audit deployed preview
        env:
          KP_AUDIT_URL: https://krakow-pocket.pages.dev/
          KP_AUDIT_LABEL: cloudflare
          KP_AUDIT_OUT: /tmp/album-preview-audit
        run: node .github/scripts/krakow-album-preview-audit.mjs
      - name: Test deployed completed mission photo replacement
        env:
          KP_AUDIT_URL: https://krakow-pocket.pages.dev/
          KP_AUDIT_LABEL: cloudflare
        run: node .github/scripts/krakow-mission-photo-replace.mjs
      - name: Upload preview reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: album-preview-audit
          path: /tmp/album-preview-audit/*
          if-no-files-found: ignore
          retention-days: 14

# final gate: isolated album preview + adaptive quota recovery + safe completed mission photo replacement
