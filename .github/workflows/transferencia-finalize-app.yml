name: Transferencia · finalizar app

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transferencia-finalize-app.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Usar PDF binarios y limpiar sistema antiguo
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, shutil

          app=Path('Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2')

          # HTML: retirar scripts de fragmentos y forzar versión nueva.
          p=app/'vehiculos.html'
          s=p.read_text()
          s='\n'.join(line for line in s.splitlines() if 'vehiculos-tpl-' not in line)+'\n'
          s=s.replace('vehiculos.css?v=20260831b','vehiculos.css?v=20260831c')
          s=s.replace('vehiculos.js?v=20260831b','vehiculos.js?v=20260831c')
          p.write_text(s)

          # JS: sustituir Base64 por carga directa de los PDF reales.
          p=app/'vehiculos.js'
          s=p.read_text()
          loader="""  const TEMPLATE_FILES = Object.freeze({
            mandate: './assets/vehiculos/mandato.pdf',
            contractParticulares: './assets/vehiculos/contrato-particulares.pdf',
            contractRehab: './assets/vehiculos/contrato-rehabilitacion.pdf'
          });
          const templateCache = new Map();

          async function templateBytes(name) {
            if (templateCache.has(name)) return templateCache.get(name).slice();
            const url = TEMPLATE_FILES[name];
            if (!url) throw new Error(`Plantilla desconocida: ${name}`);
            const response = await fetch(url, { cache: 'no-store' });
            if (!response.ok) throw new Error(`No se ha podido cargar ${url}`);
            const bytes = new Uint8Array(await response.arrayBuffer());
            templateCache.set(name, bytes);
            return bytes.slice();
          }
          """
          s,n=re.subn(r'  function templateBytes\(base64\) \{\n.*?\n  \}\n',loader,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'loader: {n} sustituciones')
          changes={
            'PDFDocument.load(templateBytes(window.VEHICLE_DOC_TEMPLATES.mandate))':"PDFDocument.load(await templateBytes('mandate'))",
            'PDFDocument.load(templateBytes(window.VEHICLE_DOC_TEMPLATES.contractRehab))':"PDFDocument.load(await templateBytes('contractRehab'))",
            'PDFDocument.load(templateBytes(window.VEHICLE_DOC_TEMPLATES.contractParticulares))':"PDFDocument.load(await templateBytes('contractParticulares'))",
            'if (!window.PDFLib || !window.VEHICLE_DOC_TEMPLATES) {':'if (!window.PDFLib) {'
          }
          for old,new in changes.items():
            if old not in s: raise SystemExit(f'No encontrado: {old}')
            s=s.replace(old,new)
          p.write_text(s)

          # SW: solo tres PDF binarios.
          p=app/'sw.js'
          s=p.read_text()
          s=re.sub(r',"\./vehiculos-tpl-[^"]+\.js"','',s)
          if './assets/vehiculos/mandato.pdf' not in s:
            s=s.replace('"./vehiculos.js"','"./vehiculos.js","./assets/vehiculos/mandato.pdf","./assets/vehiculos/contrato-particulares.pdf","./assets/vehiculos/contrato-rehabilitacion.pdf"')
          s=re.sub(r'const CACHE="[^"]+";','const CACHE="pocket-v21-transferencia-pdf-20260831";',s,count=1)
          p.write_text(s)

          # Retirar todo el transporte antiguo.
          for f in app.glob('vehiculos-tpl-*.js'): f.unlink()
          for f in (app/'assets/vehiculos').glob('*.b64'): f.unlink()
          shutil.rmtree(app/'_transport',ignore_errors=True)
          for pattern in ('_binary*','_NOTE*','_tmp-test*','README_BINARY_TEST_DELETE*'):
            for f in app.glob(pattern):
              if f.is_file(): f.unlink()
          PY

      - name: Validar plantillas y generación
        run: |
          npm install --no-save pdf-lib@1.17.1 jsdom@24.1.3
          node - <<'NODE'
          const fs=require('fs'), path=require('path'), crypto=require('crypto');
          const {PDFDocument}=require('pdf-lib');
          const app='Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2';
          const expected=[
            ['assets/vehiculos/mandato.pdf',1,'eef564a0880b1ee913456315bb7304df9410fd71be9066cc5de0eee4f39138c0'],
            ['assets/vehiculos/contrato-particulares.pdf',2,'77048a0ebdf6933a549563a92045cba0db79d9f32e98e986940ab11ba6ba1d56'],
            ['assets/vehiculos/contrato-rehabilitacion.pdf',2,'71c3e964b7cc934df797d1bb321f354eb068d62b3ebf76936c8b67c74b2fc82b']
          ];
          (async()=>{for(const [f,pages,sha] of expected){const b=fs.readFileSync(path.join(app,f));if(crypto.createHash('sha256').update(b).digest('hex')!==sha)throw Error('SHA '+f);const d=await PDFDocument.load(b);if(d.getPageCount()!==pages)throw Error('Páginas '+f);console.log('OK',f,b.length,pages)}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/scripts/test-vehiculos.mjs || true
          # La prueba antigua aún conoce fragmentos. La sustituimos en el commit y el test permanente validará la versión final.

      - name: Actualizar prueba permanente
        run: |
          cat > Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/scripts/test-vehiculos.mjs <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import vm from 'node:vm';
          import crypto from 'node:crypto';
          import * as PDFLib from 'pdf-lib';
          import { JSDOM } from 'jsdom';

          const appDir=path.resolve(path.dirname(new URL(import.meta.url).pathname),'..');
          const assets={
            mandate:['assets/vehiculos/mandato.pdf',1,'eef564a0880b1ee913456315bb7304df9410fd71be9066cc5de0eee4f39138c0'],
            contractParticulares:['assets/vehiculos/contrato-particulares.pdf',2,'77048a0ebdf6933a549563a92045cba0db79d9f32e98e986940ab11ba6ba1d56'],
            contractRehab:['assets/vehiculos/contrato-rehabilitacion.pdf',2,'71c3e964b7cc934df797d1bb321f354eb068d62b3ebf76936c8b67c74b2fc82b']
          };
          for(const [name,[file,pages,sha]] of Object.entries(assets)){
            const bytes=fs.readFileSync(path.join(appDir,file));
            if(crypto.createHash('sha256').update(bytes).digest('hex')!==sha)throw new Error(`${name}: SHA incorrecto`);
            const pdf=await PDFLib.PDFDocument.load(bytes);
            if(pdf.getPageCount()!==pages)throw new Error(`${name}: páginas incorrectas`);
            console.log(`${name}: OK · ${bytes.length} bytes · ${pages} pág.`);
          }
          const html=fs.readFileSync(path.join(appDir,'vehiculos.html'),'utf8');
          if(html.includes('vehiculos-tpl-'))throw new Error('HTML aún carga fragmentos antiguos');
          const dom=new JSDOM(html,{url:'https://pocket.test/vehiculos.html',runScripts:'outside-only',pretendToBeVisual:true});
          const {window}=dom;
          window.PDFLib=PDFLib;window.confirm=()=>true;window.scrollTo=()=>{};window.Element.prototype.scrollIntoView=()=>{};
          window.fetch=async input=>{const rel=new URL(String(input),window.location.href).pathname.replace(/^\//,'');const bytes=fs.readFileSync(path.join(appDir,rel));return{ok:true,status:200,arrayBuffer:async()=>bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength)}};
          const blobs=[];window.URL.createObjectURL=()=>`blob:test-${blobs.length+1}`;window.URL.revokeObjectURL=()=>{};window.Blob=class TestBlob{constructor(parts=[],options={}){this.parts=parts;this.type=options.type||'';blobs.push(this)}};
          vm.runInContext(fs.readFileSync(path.join(appDir,'vehiculos.js'),'utf8'),dom.getInternalVMContext(),{filename:'vehiculos.js'});
          const form=window.document.getElementById('vehicleForm');
          const sample={contractModel:'particulares',place:'Las Palmas de Gran Canaria',date:'2026-08-31',time:'10:30',price:'12500',courtCity:'Las Palmas de Gran Canaria',seller_name:'VENDEDOR PRUEBA',seller_dni:'00000000T',seller_city:'Agüimes',seller_street:'Calle Prueba',seller_number:'1',seller_cp:'35260',seller_province:'Las Palmas',buyer_name:'COMPRADOR PRUEBA',buyer_dni:'11111111H',buyer_city:'Agüimes',buyer_street:'Calle Prueba',buyer_number:'2',buyer_cp:'35260',buyer_province:'Las Palmas',brand:'MARCA',model:'MODELO',vin:'TESTVIN1234567890',plate:'0000AAA',manager1_name:'GESTOR PRUEBA',manager1_dni:'22222222J',manager1_collegeNo:'0000',collegeName:'PRUEBA',officeName:'DESPACHO PRUEBA',officeCity:'Las Palmas de Gran Canaria',officeStreet:'Calle Prueba',officeNumber:'3',officeCp:'35001',subject1:'TRANSFERENCIA DE VEHÍCULO'};
          for(const [name,value] of Object.entries(sample)){const f=form.elements.namedItem(name);if(!f)throw new Error(`Falta ${name}`);f.value=value}
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function run(model){blobs.splice(0);form.elements.namedItem('contractModel').value=model;const status=window.document.getElementById('generateStatus');status.textContent='';form.dispatchEvent(new window.Event('submit',{bubbles:true,cancelable:true}));const start=Date.now();while(Date.now()-start<10000&&status.textContent!=='4 PDF preparados.'){if(status.textContent.startsWith('No se')||status.textContent.startsWith('Faltan'))throw new Error(status.textContent);await sleep(25)}if(status.textContent!=='4 PDF preparados.')throw new Error(`Estado: ${status.textContent}`);if(blobs.length!==4)throw new Error(`${model}: ${blobs.length} PDF`);const counts=[];for(const blob of blobs){const pdf=await PDFLib.PDFDocument.load(blob.parts[0]);counts.push(pdf.getPageCount())}if(counts.join('/')!=='1/1/2/1')throw new Error(`${model}: páginas ${counts.join('/')}`);console.log(`${model}: 4 PDF · páginas ${counts.join('/')}`)}
          await run('particulares');await run('rehabilitacion');console.log('Transferencia: prueba integral superada.');
          EOF
          npm install --no-save pdf-lib@1.17.1 jsdom@24.1.3
          node Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/scripts/test-vehiculos.mjs

      - name: Publicar
        run: |
          git config user.name 'Pocket Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Finaliza Transferencia con plantillas PDF binarias'
          git push
