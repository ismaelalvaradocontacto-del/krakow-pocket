name: Krakow Pocket audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static JavaScript syntax audit
        run: |
          set -euxo pipefail
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          for f in "$APP_DIR"/*.js .github/scripts/*.mjs; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Structural data and PWA integrity audit
        run: node .github/scripts/krakow-structural.mjs
      - name: Visual system integrity audit
        run: |
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          grep -q 'visual system v8.0' "$APP_DIR/profiles.css"
          grep -q 'focus-visible' "$APP_DIR/profiles.css"
          grep -q 'grid-template-columns:repeat(3,minmax(0,1fr))' "$APP_DIR/profiles.css"
          grep -q 'prefers-reduced-motion' "$APP_DIR/profiles.css"
          grep -q 'iPhone layout hotfix v8.1' "$APP_DIR/mobile-hotfix.css"
          grep -q 'hyphens:none!important' "$APP_DIR/mobile-hotfix.css"
          grep -q 'overflow-x:clip!important' "$APP_DIR/mobile-hotfix.css"
          grep -q 'pageScaleLocked: true' "$APP_DIR/stability.js"
          grep -q 'landmarkArtLayer: true' "$APP_DIR/stability.js"
          grep -q "version: '2.1'" "$APP_DIR/landmark-art-fix.js"
          grep -q 'landmark-dragon' "$APP_DIR/assets/landmarks-v2.svg"
          grep -q 'landmark-ghetto' "$APP_DIR/assets/landmarks-v2.svg"
          test -s "$APP_DIR/STYLE_AUDIT_20260811.md"
      - name: Install browser audit tooling
        run: |
          npm install --no-save playwright@1.55.0 >/tmp/npm-playwright.log 2>&1
          npx playwright install --with-deps chromium webkit >/tmp/playwright-install.log 2>&1
          echo "Playwright browsers installed"
      - name: Start local production mirror
        run: |
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$APP_DIR" > /tmp/krakow-http.log 2>&1 &
          echo $! > /tmp/krakow-http.pid
          sleep 2
          curl -fsS -I http://127.0.0.1:4173/
          curl -fsS http://127.0.0.1:4173/stability.js | grep -q 'automaticReloadsBlocked'
          curl -fsS http://127.0.0.1:4173/mobile-hotfix.css | grep -q 'iPhone layout hotfix v8.1'
          curl -fsS http://127.0.0.1:4173/landmark-art-fix.js | grep -q "version: '2.1'"
          curl -fsS http://127.0.0.1:4173/assets/landmarks-v2.svg | grep -q 'landmark-dragon'
          curl -fsS http://127.0.0.1:4173/state-bridge.js | grep -q '__kpStateBridge'
          curl -fsS http://127.0.0.1:4173/network-status.js | grep -q 'offlineUiGuard: true'
          curl -fsS http://127.0.0.1:4173/player-stability.js | grep -q 'deterministicSelection: true'
          curl -fsS http://127.0.0.1:4173/world-art-stability.js | grep -q 'navigationRepaint:true'
          curl -fsS http://127.0.0.1:4173/interaction-fix.js | grep -q 'celebrationRecovery: true'
          curl -fsS http://127.0.0.1:4173/interaction-fix.js | grep -q 'reversibleNonQuestDiscoveries: true'
          curl -fsS http://127.0.0.1:4173/interaction-fix.js | grep -q 'lateSyncNudges: false'
          curl -fsS http://127.0.0.1:4173/mission-fix.js | grep -q '__kpMissionUxV4'
          curl -fsS http://127.0.0.1:4173/celebration-guard.js | grep -q '__kpCelebrationGuard'
          curl -fsS http://127.0.0.1:4173/celebration-stability.js | grep -q '__kpCelebrationStability'
          curl -fsS http://127.0.0.1:4173/portrait-stability.js | grep -q 'profilesVerified: profileHealth()'
      - name: Run local Chromium and WebKit smoke audit
        run: node .github/scripts/krakow-smoke.mjs
      - name: Verify all 12 quest drawings locally
        run: node .github/scripts/krakow-landmark-art.mjs
      - name: Run mobile viewport matrix audit
        run: |
          set +e
          timeout 180s node .github/scripts/krakow-mobile-matrix.mjs >/tmp/mobile-matrix.log 2>&1
          CODE=$?
          tail -n 180 /tmp/mobile-matrix.log
          exit $CODE
      - name: Run isolated write-flow interaction audit
        run: |
          set +e
          timeout 180s node .github/scripts/krakow-interactions.mjs >/tmp/interaction.log 2>&1
          CODE=$?
          tail -n 220 /tmp/interaction.log
          exit $CODE
      - name: Prove local app does not reload itself
        run: node .github/scripts/krakow-reload-stability.mjs
      - name: Prove PWA boots offline
        run: timeout 120s node .github/scripts/krakow-offline.mjs
      - name: Wait for Cloudflare Pages production
        run: |
          for i in {1..45}; do
            STATE_OK=0
            NETWORK_OK=0
            PLAYER_OK=0
            WORLD_OK=0
            INTERACTION_OK=0
            MISSION_OK=0
            GUARD_OK=0
            CELEBRATION_OK=0
            PORTRAIT_OK=0
            STYLE_OK=0
            HOTFIX_OK=0
            LANDMARK_OK=0
            SPRITE_OK=0
            CACHE_OK=0
            curl -fsS https://krakow-pocket.pages.dev/state-bridge.js | grep -q 'world-art-stability.js' && STATE_OK=1 || true
            curl -fsS https://krakow-pocket.pages.dev/network-status.js | grep -q 'offlineUiGuard: true' && NETWORK_OK=1 || true
            curl -fsS https://krakow-pocket.pages.dev/player-stability.js | grep -q 'deterministicSelection: true' && PLAYER_OK=1 || true
            curl -fsS https://krakow-pocket.pages.dev/world-art-stability.js | grep -q 'navigationRepaint:true' && WORLD_OK=1 || true
            curl -fsS https://krakow-pocket.pages.dev/interaction-fix.js | grep -q 'lateSyncNudges: false' && INTERACTION_OK=1 || true
            curl -fsS https://krakow-pocket.pages.dev/mission-fix.js | grep -q '__kpMissionUxV4' && MISSION_OK=1 || true
            curl -fsS https://krakow-pocket.pages.dev/celebration-guard.js | grep -q '__kpCelebrationGuard' && GUARD_OK=1 || true
            curl -fsS https://krakow-pocket.pages.dev/celebration-stability.js | grep -q 'delayedDuplicateBlocked' && CELEBRATION_OK=1 || true
            curl -fsS https://krakow-pocket.pages.dev/portrait-stability.js | grep -q 'profilesVerified: profileHealth()' && PORTRAIT_OK=1 || true
            curl -fsS https://krakow-pocket.pages.dev/profiles.css | grep -q 'visual system v8.0' && STYLE_OK=1 || true
            curl -fsS https://krakow-pocket.pages.dev/mobile-hotfix.css | grep -q 'iPhone layout hotfix v8.1' && HOTFIX_OK=1 || true
            curl -fsS https://krakow-pocket.pages.dev/landmark-art-fix.js | grep -q "version: '2.1'" && LANDMARK_OK=1 || true
            curl -fsS https://krakow-pocket.pages.dev/assets/landmarks-v2.svg | grep -q 'landmark-dragon' && SPRITE_OK=1 || true
            curl -fsS https://krakow-pocket.pages.dev/sw.js | grep -q 'krakow-pocket-v22-landmark-art-20260811b' && CACHE_OK=1 || true
            if [ "$STATE_OK" = "1" ] && [ "$NETWORK_OK" = "1" ] && [ "$PLAYER_OK" = "1" ] && [ "$WORLD_OK" = "1" ] && [ "$INTERACTION_OK" = "1" ] && [ "$MISSION_OK" = "1" ] && [ "$GUARD_OK" = "1" ] && [ "$CELEBRATION_OK" = "1" ] && [ "$PORTRAIT_OK" = "1" ] && [ "$STYLE_OK" = "1" ] && [ "$HOTFIX_OK" = "1" ] && [ "$LANDMARK_OK" = "1" ] && [ "$SPRITE_OK" = "1" ] && [ "$CACHE_OK" = "1" ]; then
              echo "Cloudflare is serving the full audited build"
              exit 0
            fi
            sleep 4
          done
          echo "Cloudflare production did not converge to the audited build in time"
          exit 1
      - name: Run live Cloudflare Chromium and WebKit audit
        env:
          KP_AUDIT_URL: https://krakow-pocket.pages.dev/
        run: node .github/scripts/krakow-smoke.mjs
      - name: Verify all 12 quest drawings on Cloudflare
        env:
          KP_AUDIT_URL: https://krakow-pocket.pages.dev/
        run: node .github/scripts/krakow-landmark-art.mjs
      - name: Prove live Cloudflare app does not reload itself
        env:
          KP_AUDIT_URL: https://krakow-pocket.pages.dev/
        run: node .github/scripts/krakow-reload-stability.mjs
      - name: Build complete repository ZIP
        if: success()
        run: git archive --format=zip --output=Krakow_Pocket_COMPLETE_20260811.zip HEAD
      - name: Upload complete repository ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: krakow-pocket-complete
          path: Krakow_Pocket_COMPLETE_20260811.zip
          if-no-files-found: error
      - name: Upload audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krakow-audit-screenshots
          path: audit-*.png
          if-no-files-found: ignore
