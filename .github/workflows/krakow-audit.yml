name: Krakow Pocket audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static JavaScript syntax audit
        run: |
          set -euxo pipefail
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          for f in "$APP_DIR"/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Install browser audit tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Start local production mirror
        run: |
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$APP_DIR" > /tmp/krakow-http.log 2>&1 &
          echo $! > /tmp/krakow-http.pid
          sleep 2
          curl -fsS -I http://127.0.0.1:4173/
          curl -fsS http://127.0.0.1:4173/data.js | head -c 80
      - name: Run local Chromium and WebKit smoke audit
        run: node .github/scripts/krakow-smoke.mjs
      - name: Wait for Cloudflare Pages production
        run: |
          for i in {1..30}; do
            if curl -fsS https://krakow-pocket.pages.dev/runtime.js | grep -q '6.8.1'; then
              echo "Cloudflare is serving this runtime"
              exit 0
            fi
            sleep 4
          done
          echo "Cloudflare production did not converge to the audited runtime in time"
          exit 1
      - name: Run live Cloudflare Chromium and WebKit audit
        env:
          KP_AUDIT_URL: https://krakow-pocket.pages.dev/
        run: node .github/scripts/krakow-smoke.mjs
      - name: Upload audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krakow-audit-screenshots
          path: audit-*.png
          if-no-files-found: ignore
