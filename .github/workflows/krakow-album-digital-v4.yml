name: Krakow Pocket digital album v4 audit

on:
  push:
    branches: [main]
    paths:
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-experience.js'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-v3-polish.js'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-ios-compat.js'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-digital-v4.js'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-photo-quality.js'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/stability.js'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/sw.js'
      - '.github/scripts/krakow-album-digital-v4.mjs'
      - '.github/scripts/krakow-album-ios-offline.mjs'
      - '.github/workflows/krakow-album-digital-v4.yml'
  workflow_dispatch:

jobs:
  digital-album:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static digital album integrity
        run: |
          set -euxo pipefail
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          node --check "$APP_DIR/album-digital-v4.js"
          node --check "$APP_DIR/album-photo-quality.js"
          node --check .github/scripts/krakow-album-digital-v4.mjs
          node --check .github/scripts/krakow-album-ios-offline.mjs
          grep -q 'const VERSION = "4.0"' "$APP_DIR/album-digital-v4.js"
          grep -q 'immersiveSpreads: true' "$APP_DIR/album-digital-v4.js"
          grep -q 'cinemaStory: true' "$APP_DIR/album-digital-v4.js"
          grep -q 'autoplay: true' "$APP_DIR/album-digital-v4.js"
          grep -q 'filmstrip: true' "$APP_DIR/album-digital-v4.js"
          grep -q 'noJsCompatible: true' "$APP_DIR/album-digital-v4.js"
          grep -q 'const TARGET_MAX = 1280' "$APP_DIR/album-photo-quality.js"
          grep -q 'const MAX_DATA_LENGTH = 300000' "$APP_DIR/album-photo-quality.js"
          grep -q 'digitalAlbumV4: true' "$APP_DIR/stability.js"
          grep -q 'albumPhotoQuality: true' "$APP_DIR/stability.js"
          grep -q 'album-digital-v4.js' "$APP_DIR/sw.js"
          grep -q 'album-photo-quality.js' "$APP_DIR/sw.js"
          grep -q 'krakow-pocket-v42-digital-album-20260812a' "$APP_DIR/sw.js"
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0 >/tmp/npm-playwright.log 2>&1
          npx playwright install --with-deps chromium webkit >/tmp/playwright-install.log 2>&1
      - name: Start local production mirror
        run: |
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$APP_DIR" >/tmp/kp-digital-album-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4173/album-digital-v4.js | grep -q 'const VERSION = "4.0"'
          curl -fsS http://127.0.0.1:4173/album-photo-quality.js | grep -q 'TARGET_MAX = 1280'
      - name: Audit digital album locally
        run: node .github/scripts/krakow-album-digital-v4.mjs
      - name: Audit downloaded album without JavaScript locally
        run: node .github/scripts/krakow-album-ios-offline.mjs
      - name: Wait for Cloudflare production
        run: |
          for i in {1..45}; do
            DIGITAL=0; QUALITY=0; CACHE=0; STABLE=0
            curl -fsS https://krakow-pocket.pages.dev/album-digital-v4.js | grep -q 'const VERSION = "4.0"' && DIGITAL=1 || true
            curl -fsS https://krakow-pocket.pages.dev/album-photo-quality.js | grep -q 'TARGET_MAX = 1280' && QUALITY=1 || true
            curl -fsS https://krakow-pocket.pages.dev/sw.js | grep -q 'krakow-pocket-v42-digital-album-20260812a' && CACHE=1 || true
            curl -fsS https://krakow-pocket.pages.dev/stability.js | grep -q 'digitalAlbumV4: true' && STABLE=1 || true
            if [ "$DIGITAL" = 1 ] && [ "$QUALITY" = 1 ] && [ "$CACHE" = 1 ] && [ "$STABLE" = 1 ]; then exit 0; fi
            sleep 4
          done
          exit 1
      - name: Audit digital album on Cloudflare
        env:
          KP_AUDIT_URL: https://krakow-pocket.pages.dev/
        run: node .github/scripts/krakow-album-digital-v4.mjs
      - name: Audit downloaded album without JavaScript on Cloudflare
        env:
          KP_AUDIT_URL: https://krakow-pocket.pages.dev/
        run: node .github/scripts/krakow-album-ios-offline.mjs
      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: album-v4-digital-visual-audit
          path: /tmp/album-v4-*.png
          if-no-files-found: ignore
          retention-days: 7
