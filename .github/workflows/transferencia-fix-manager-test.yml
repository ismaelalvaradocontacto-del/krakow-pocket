name: Transferencia · cierre final registrado

on:
  push:
    branches: [main]
    paths:
      - '.transferencia-run2'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Migrar a PDF binarios y limpiar restos
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, shutil, textwrap

          app = Path('Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2')

          p = app / 'vehiculos.html'
          s = p.read_text()
          s = '\n'.join(line for line in s.splitlines() if 'vehiculos-tpl-' not in line) + '\n'
          s = s.replace('vehiculos.css?v=20260831b', 'vehiculos.css?v=20260831c')
          s = s.replace('vehiculos.js?v=20260831b', 'vehiculos.js?v=20260831c')
          p.write_text(s)

          p = app / 'vehiculos.js'
          s = p.read_text()
          old_size = 'const W = page.getWidth(), H = page.getHeight(), M = 44;'
          if old_size in s:
              s = s.replace(old_size, 'const W = 595.28, H = 841.89, M = 44;', 1)
          old_hr = 'const hr = () => { page.drawLine({start:{x:M,y},end:{x:W-M,y},thickness:.6,color:line}); y -= 16; };'
          new_hr = 'const hr = () => { y -= 16; };'
          if old_hr not in s:
              raise SystemExit('No se encontró la línea decorativa del PDF del gestor')
          s = s.replace(old_hr, new_hr, 1)

          new_loader = '''  const TEMPLATE_FILES = Object.freeze({
            mandate: './assets/vehiculos/mandato.pdf',
            contractParticulares: './assets/vehiculos/contrato-particulares.pdf',
            contractRehab: './assets/vehiculos/contrato-rehabilitacion.pdf'
          });
          const templateCache = new Map();

          async function templateBytes(name) {
            if (templateCache.has(name)) return templateCache.get(name).slice(0);
            const url = TEMPLATE_FILES[name];
            if (!url) throw new Error(`Plantilla desconocida: ${name}`);
            const response = await fetch(url, { cache: 'no-store' });
            if (!response.ok) throw new Error(`No se ha podido cargar ${url}`);
            const bytes = await response.arrayBuffer();
            templateCache.set(name, bytes);
            return bytes.slice(0);
          }
          '''
          s, n = re.subn(r'  function templateBytes\(base64\) \{\n.*?\n  \}\n', new_loader, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'templateBytes: se esperaban 1 sustitución y hubo {n}')

          replacements = {
            'PDFDocument.load(templateBytes(window.VEHICLE_DOC_TEMPLATES.mandate))': "PDFDocument.load(await templateBytes('mandate'))",
            'PDFDocument.load(templateBytes(window.VEHICLE_DOC_TEMPLATES.contractRehab))': "PDFDocument.load(await templateBytes('contractRehab'))",
            'PDFDocument.load(templateBytes(window.VEHICLE_DOC_TEMPLATES.contractParticulares))': "PDFDocument.load(await templateBytes('contractParticulares'))",
            'if (!window.PDFLib || !window.VEHICLE_DOC_TEMPLATES) {': 'if (!window.PDFLib) {'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'No se encontró: {old}')
              s = s.replace(old, new)
          p.write_text(s)

          p = app / 'sw.js'
          s = p.read_text()
          s = re.sub(r',"\./vehiculos-tpl-[^"]+\.js"', '', s)
          if './assets/vehiculos/mandato.pdf' not in s:
              s = s.replace('"./vehiculos.js"', '"./vehiculos.js","./assets/vehiculos/mandato.pdf","./assets/vehiculos/contrato-particulares.pdf","./assets/vehiculos/contrato-rehabilitacion.pdf"')
          s = re.sub(r'const CACHE="[^"]+";', 'const CACHE="pocket-v21-transferencia-pdf-20260831";', s, count=1)
          p.write_text(s)

          test = r'''import fs from 'node:fs';
          import path from 'node:path';
          import vm from 'node:vm';
          import crypto from 'node:crypto';
          import * as PDFLib from 'pdf-lib';
          import { JSDOM } from 'jsdom';

          const appDir=path.resolve(path.dirname(new URL(import.meta.url).pathname),'..');
          const assets={
            mandate:['assets/vehiculos/mandato.pdf',1,'eef564a0880b1ee913456315bb7304df9410fd71be9066cc5de0eee4f39138c0'],
            contractParticulares:['assets/vehiculos/contrato-particulares.pdf',2,'77048a0ebdf6933a549563a92045cba0db79d9f32e98e986940ab11ba6ba1d56'],
            contractRehab:['assets/vehiculos/contrato-rehabilitacion.pdf',2,'71c3e964b7cc934df797d1bb321f354eb068d62b3ebf76936c8b67c74b2fc82b']
          };
          for(const [name,[file,pages,sha]] of Object.entries(assets)){
            const bytes=fs.readFileSync(path.join(appDir,file));
            if(crypto.createHash('sha256').update(bytes).digest('hex')!==sha) throw new Error(`${name}: SHA incorrecto`);
            const pdf=await PDFLib.PDFDocument.load(bytes);
            if(pdf.getPageCount()!==pages) throw new Error(`${name}: páginas incorrectas`);
            console.log(`${name}: OK · ${bytes.length} bytes · ${pages} pág.`);
          }

          const html=fs.readFileSync(path.join(appDir,'vehiculos.html'),'utf8');
          if(html.includes('vehiculos-tpl-')) throw new Error('HTML aún carga fragmentos antiguos');
          const dom=new JSDOM(html,{url:'https://pocket.test/vehiculos.html',runScripts:'outside-only',pretendToBeVisual:true});
          const {window}=dom;
          window.PDFLib=PDFLib;
          window.confirm=()=>true;
          window.scrollTo=()=>{};
          window.Element.prototype.scrollIntoView=()=>{};
          window.fetch=async input=>{
            const rel=new URL(String(input),window.location.href).pathname.replace(/^\//,'');
            const bytes=fs.readFileSync(path.join(appDir,rel));
            return {ok:true,status:200,arrayBuffer:async()=>bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength)};
          };
          const blobs=[];
          window.URL.createObjectURL=()=>`blob:test-${blobs.length+1}`;
          window.URL.revokeObjectURL=()=>{};
          window.Blob=class TestBlob{constructor(parts=[],options={}){this.parts=parts;this.type=options.type||'';blobs.push(this);}};
          vm.runInContext(fs.readFileSync(path.join(appDir,'vehiculos.js'),'utf8'),dom.getInternalVMContext(),{filename:'vehiculos.js'});

          const form=window.document.getElementById('vehicleForm');
          const sample={contractModel:'particulares',place:'Las Palmas de Gran Canaria',date:'2026-08-31',time:'10:30',price:'12500',courtCity:'Las Palmas de Gran Canaria',seller_name:'VENDEDOR PRUEBA',seller_dni:'00000000T',seller_city:'Agüimes',seller_street:'Calle Prueba',seller_number:'1',seller_cp:'35260',seller_province:'Las Palmas',buyer_name:'COMPRADOR PRUEBA',buyer_dni:'11111111H',buyer_city:'Agüimes',buyer_street:'Calle Prueba',buyer_number:'2',buyer_cp:'35260',buyer_province:'Las Palmas',brand:'MARCA',model:'MODELO',vin:'TESTVIN1234567890',plate:'0000AAA',manager1_name:'GESTOR PRUEBA',manager1_dni:'22222222J',manager1_collegeNo:'0000',collegeName:'PRUEBA',officeName:'DESPACHO PRUEBA',officeCity:'Las Palmas de Gran Canaria',officeStreet:'Calle Prueba',officeNumber:'3',officeCp:'35001',subject1:'TRANSFERENCIA DE VEHÍCULO'};
          for(const [name,value] of Object.entries(sample)){
            const f=form.elements.namedItem(name);
            if(!f) throw new Error(`Falta ${name}`);
            f.value=value;
          }
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function run(model){
            blobs.splice(0);
            form.elements.namedItem('contractModel').value=model;
            const status=window.document.getElementById('generateStatus');
            status.textContent='';
            form.dispatchEvent(new window.Event('submit',{bubbles:true,cancelable:true}));
            const start=Date.now();
            while(Date.now()-start<10000 && status.textContent!=='4 PDF preparados.'){
              if(status.textContent.startsWith('No se')||status.textContent.startsWith('Faltan')) throw new Error(status.textContent);
              await sleep(25);
            }
            if(status.textContent!=='4 PDF preparados.') throw new Error(`Estado: ${status.textContent}`);
            if(blobs.length!==4) throw new Error(`${model}: ${blobs.length} PDF`);
            const counts=[];
            for(const blob of blobs){
              const pdf=await PDFLib.PDFDocument.load(blob.parts[0]);
              counts.push(pdf.getPageCount());
            }
            if(counts.join('/')!=='1/1/2/1') throw new Error(`${model}: páginas ${counts.join('/')}`);
            console.log(`${model}: 4 PDF · páginas ${counts.join('/')}`);
          }
          await run('particulares');
          await run('rehabilitacion');
          console.log('Transferencia: prueba integral superada.');
          '''
          (app/'scripts/test-vehiculos.mjs').write_text(textwrap.dedent(test))

          for f in app.glob('vehiculos-tpl-*.js'): f.unlink()
          for f in (app/'assets/vehiculos').glob('*.b64'): f.unlink()
          shutil.rmtree(app/'_transport', ignore_errors=True)
          for pattern in ['_binary*','_NOTE*','_tmp-test*','README_BINARY_TEST_DELETE*']:
              for f in app.glob(pattern):
                  if f.is_file(): f.unlink()
          PY

      - name: Probar los cuatro PDF con ambos contratos
        run: |
          npm install --no-save pdf-lib@1.17.1 jsdom@24.1.3
          node Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/scripts/test-vehiculos.mjs

      - name: Publicar cierre limpio
        run: |
          set -euo pipefail
          git config user.name 'Pocket Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Finaliza Transferencia con plantillas PDF binarias'
          git push
