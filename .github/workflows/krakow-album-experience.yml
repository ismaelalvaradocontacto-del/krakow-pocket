name: Krakow Pocket interactive album audit

on:
  push:
    branches: [main]
    paths:
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-experience.js'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-v3-polish.js'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-ios-compat.js'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-digital-v4.js'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-photo-quality.js'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/stability.js'
      - 'Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/sw.js'
      - '.github/scripts/krakow-album-v3-audit.mjs'
      - '.github/workflows/krakow-album-experience.yml'
  workflow_dispatch:

jobs:
  album:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static album checks
        run: |
          set -euxo pipefail
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          node --check "$APP_DIR/album-experience.js"
          node --check "$APP_DIR/album-v3-polish.js"
          node --check "$APP_DIR/album-ios-compat.js"
          node --check .github/scripts/krakow-album-v3-audit.mjs
          grep -q 'const VERSION = "3.0"' "$APP_DIR/album-experience.js"
          grep -q 'const VERSION="1.0"' "$APP_DIR/album-v3-polish.js"
          grep -q 'storyMode:true' "$APP_DIR/album-experience.js"
          grep -q 'noJsReady:true' "$APP_DIR/album-experience.js"
          grep -q 'accessible:true' "$APP_DIR/album-experience.js"
          grep -q 'mobileToolbarFits:true' "$APP_DIR/album-v3-polish.js"
          grep -q 'spanishDateCase:true' "$APP_DIR/album-v3-polish.js"
          grep -q 'data-kp-offline-compat' "$APP_DIR/album-experience.js"
          grep -q '@media print' "$APP_DIR/album-experience.js"
          grep -q 'albumExperienceV3: true' "$APP_DIR/stability.js"
          grep -q 'albumVisualPolish: true' "$APP_DIR/stability.js"
          grep -q 'album-v3-polish.js' "$APP_DIR/sw.js"
          grep -q 'krakow-pocket-v42-digital-album-20260812a' "$APP_DIR/sw.js"
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0 >/tmp/npm-playwright.log 2>&1
          npx playwright install --with-deps chromium webkit >/tmp/playwright-install.log 2>&1
      - name: Start local app
        run: |
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$APP_DIR" >/tmp/kp-album-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4173/album-experience.js | grep -q 'const VERSION = "3.0"'
          curl -fsS http://127.0.0.1:4173/album-v3-polish.js | grep -q 'mobileToolbarFits:true'
      - name: Verify album locally
        run: node .github/scripts/krakow-album-v3-audit.mjs
      - name: Wait for Cloudflare build
        run: |
          for i in {1..45}; do
            ALBUM=0; POLISH=0; CACHE=0; LOADER=0
            curl -fsS https://krakow-pocket.pages.dev/album-experience.js | grep -q 'const VERSION = "3.0"' && ALBUM=1 || true
            curl -fsS https://krakow-pocket.pages.dev/album-v3-polish.js | grep -q 'mobileToolbarFits:true' && POLISH=1 || true
            curl -fsS https://krakow-pocket.pages.dev/sw.js | grep -q 'krakow-pocket-v42-digital-album-20260812a' && CACHE=1 || true
            curl -fsS https://krakow-pocket.pages.dev/stability.js | grep -q 'albumVisualPolish: true' && LOADER=1 || true
            if [ "$ALBUM" = 1 ] && [ "$POLISH" = 1 ] && [ "$CACHE" = 1 ] && [ "$LOADER" = 1 ]; then exit 0; fi
            sleep 4
          done
          exit 1
      - name: Verify album on Cloudflare
        env:
          KP_AUDIT_URL: https://krakow-pocket.pages.dev/
        run: node .github/scripts/krakow-album-v3-audit.mjs
      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: album-v3-visual-audit
          path: /tmp/album-v3-*.png
          if-no-files-found: ignore
          retention-days: 7
