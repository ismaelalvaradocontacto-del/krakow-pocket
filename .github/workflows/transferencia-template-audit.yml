name: Transferencia template audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit templates
        shell: bash
        run: |
          python - <<'PY' > TRANSFERENCIA_TEMPLATE_AUDIT.txt
          from pathlib import Path
          import re, base64, hashlib
          app=Path('Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2')
          groups={
            'mandato': sorted(app.glob('vehiculos-tpl-mandate-*.js')),
            'particulares': sorted(app.glob('vehiculos-tpl-contractparticulares-*.js')),
            'rehabilitacion': sorted(app.glob('vehiculos-tpl-contractrehab-*.js')),
          }
          expected={
            'mandato': ('eef564a0880b1ee913456315bb7304df9410fd71be9066cc5de0eee4f39138c0',175100),
            'particulares': ('77048a0ebdf6933a549563a92045cba0db79d9f32e98e986940ab11ba6ba1d56',78922),
            'rehabilitacion': ('71c3e964b7cc934df797d1bb321f354eb068d62b3ebf76936c8b67c74b2fc82b',37013),
          }
          def payload(p):
            s=p.read_text(errors='replace')
            matches=re.findall(r'\+"([A-Za-z0-9+/=]+)"',s)
            if not matches:
              matches=re.findall(r'=\s*"([A-Za-z0-9+/=]+)"',s)
            return ''.join(matches)
          for name,paths in groups.items():
            print(f'[{name}] files={len(paths)}')
            chunks=[]
            for p in paths:
              c=payload(p); chunks.append(c)
              print(p.name, 'chars=',len(c), 'sha256=',hashlib.sha256(c.encode()).hexdigest())
            b64=''.join(chunks)
            print('base64_chars=',len(b64))
            try:
              data=base64.b64decode(b64,validate=True)
              sha=hashlib.sha256(data).hexdigest()
              print('bytes=',len(data),'sha256=',sha,'header=',data[:8],'tail=',data[-8:])
              print('expected=',expected[name][1],expected[name][0])
              print('MATCH=', len(data)==expected[name][1] and sha==expected[name][0])
            except Exception as e:
              print('DECODE_ERROR=',repr(e))
            print()
          PY
          cat TRANSFERENCIA_TEMPLATE_AUDIT.txt
      - name: Persist audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TRANSFERENCIA_TEMPLATE_AUDIT.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Actualiza auditoría de plantillas de Transferencia"
          git push
