name: Krakow Pocket Auschwitz extra audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  auschwitz-extra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static Auschwitz extra checks
        run: |
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          node --check "$APP_DIR/auschwitz-extra.js"
          node --check .github/scripts/krakow-auschwitz-extra.mjs
          grep -q 'countsTowardCore:false' "$APP_DIR/auschwitz-extra.js"
          grep -q 'respectMode:true' "$APP_DIR/auschwitz-extra.js"
          grep -q 'acceptsAuschwitzI:true' "$APP_DIR/auschwitz-extra.js"
          grep -q 'acceptsBirkenau:true' "$APP_DIR/auschwitz-extra.js"
          grep -q 'storesExactCoordinates:false' "$APP_DIR/auschwitz-extra.js"
          grep -q 'auschwitz-extra.js?v=20260811a' "$APP_DIR/state-bridge.js"
          grep -q 'krakow-pocket-v37-auschwitz-extra-20260811a' "$APP_DIR/sw.js"
          grep -q './auschwitz-extra.js' "$APP_DIR/sw.js"
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0 >/tmp/npm-playwright.log 2>&1
          npx playwright install --with-deps chromium webkit >/tmp/playwright-install.log 2>&1
      - name: Start local app
        run: |
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$APP_DIR" >/tmp/krakow-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4173/auschwitz-extra.js | grep -q 'respectMode:true'
      - name: Verify Auschwitz extra locally
        run: node .github/scripts/krakow-auschwitz-extra.mjs
      - name: Wait for Cloudflare build
        run: |
          for i in {1..60}; do
            EXTRA=0; CACHE=0
            curl -fsS https://krakow-pocket.pages.dev/auschwitz-extra.js | grep -q 'countsTowardCore:false' && EXTRA=1 || true
            curl -fsS https://krakow-pocket.pages.dev/sw.js | grep -q 'krakow-pocket-v37-auschwitz-extra-20260811a' && CACHE=1 || true
            if [ "$EXTRA" = "1" ] && [ "$CACHE" = "1" ]; then
              echo "Cloudflare Auschwitz extra build is live"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Verify Auschwitz extra on Cloudflare
        env:
          KP_AUDIT_URL: https://krakow-pocket.pages.dev/
        run: node .github/scripts/krakow-auschwitz-extra.mjs
