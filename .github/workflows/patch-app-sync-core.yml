name: Patch Krakow Pocket R4 scroll assertion

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-app-sync-core.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-r4-scroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch non-zero scroll setup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/krakow-album-v5-final-audit-r4.mjs')
          s=p.read_text()
          old="""  await stableFrameEval(f,'html',()=>{document.documentElement.style.scrollBehavior='auto';scrollTo(0,180)});await page.waitForTimeout(100);const y1=await stableFrameEval(f,'body',()=>scrollY);await page.evaluate(()=>{memoryTitle.value='Scroll estable';memoryNote.value='Recuerdo nuevo';memoryPlace.value='Cracovia';memoryForm.requestSubmit()});await page.waitForTimeout(1900);const y2=await stableFrameEval(f,'body',()=>scrollY);check('non-zero scroll stable',Math.abs(y2-y1)<=4,`${y1}->${y2}`);await stableFrameEval(f,'html',()=>{document.documentElement.style.scrollBehavior='auto';scrollTo(0,0)});await page.waitForTimeout(100);await page.evaluate(()=>{memoryTitle.value='Scroll cero';memoryNote.value='Recuerdo arriba';memoryPlace.value='Cracovia';memoryForm.requestSubmit()});await page.waitForTimeout(1900);const y0=await stableFrameEval(f,'body',()=>scrollY);check('zero scroll stable',Math.abs(y0)<=4,`0->${y0}`);"""
          new="""  let y1=0;for(let i=0;i<10;i++){y1=await stableFrameEval(f,'html',()=>{document.documentElement.style.scrollBehavior='auto';const max=Math.max(0,document.documentElement.scrollHeight-innerHeight),target=Math.min(180,max);scrollTo(0,target);return scrollY});if(y1>20)break;await page.waitForTimeout(120)}check('non-zero scroll position established',y1>20,`start=${y1}`);await page.evaluate(()=>{memoryTitle.value='Scroll estable';memoryNote.value='Recuerdo nuevo';memoryPlace.value='Cracovia';memoryForm.requestSubmit()});await page.waitForTimeout(1900);const y2=await stableFrameEval(f,'body',()=>scrollY);check('non-zero scroll stable',y1>20&&Math.abs(y2-y1)<=8,`${y1}->${y2}`);await stableFrameEval(f,'html',()=>{document.documentElement.style.scrollBehavior='auto';scrollTo(0,0)});await page.waitForTimeout(120);await page.evaluate(()=>{memoryTitle.value='Scroll cero';memoryNote.value='Recuerdo arriba';memoryPlace.value='Cracovia';memoryForm.requestSubmit()});await page.waitForTimeout(1900);const y0=await stableFrameEval(f,'body',()=>scrollY);check('zero scroll stable',Math.abs(y0)<=4,`0->${y0}`);"""
          if old not in s:
              raise SystemExit('R4 scroll block not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check .github/scripts/krakow-album-v5-final-audit-r4.mjs
          grep -q 'non-zero scroll position established' .github/scripts/krakow-album-v5-final-audit-r4.mjs
      - name: Commit deterministic scroll audit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/scripts/krakow-album-v5-final-audit-r4.mjs
          git commit -m "Make R4 non-zero scroll assertion deterministic"
          git push origin HEAD:main
