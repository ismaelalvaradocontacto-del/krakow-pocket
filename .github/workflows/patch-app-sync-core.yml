name: Patch Krakow Pocket Safari album refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-app-sync-core.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-album-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Canonicalize signatures and deferred refresh
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-next.js')
          s=p.read_text()

          old='''function sig(){const s=projected();return JSON.stringify({e:Object.entries(s.missionEvidence||{}).map(([id,x])=>[id,x?.updatedAt,x?.photo?.length,x?.title]),a:active(s.albumPhotos).map(x=>[x.id,x.updatedAt,x.photo?.length,x.title,x.deletedAt]),m:active(s.memories).map(x=>[x.id,x.updatedAt||x.ts,x.title,x.note])})}'''
          new='''const canonId=x=>String(x?.id||"");\nfunction sig(){const s=projected(),e=Object.entries(s.missionEvidence||{}).sort(([a],[b])=>String(a).localeCompare(String(b))).map(([id,x])=>[id,x?.updatedAt,x?.photo?.length,x?.title]),a=active(s.albumPhotos).slice().sort((x,y)=>canonId(x).localeCompare(canonId(y))).map(x=>[x.id,x.updatedAt,x.photo?.length,x.title,x.deletedAt]),m=active(s.memories).slice().sort((x,y)=>canonId(x).localeCompare(canonId(y))).map(x=>[x.id,x.updatedAt||x.ts,x.title,x.note]);return JSON.stringify({e,a,m})}'''
          if old not in s:
              raise SystemExit('signature target not found')
          s=s.replace(old,new,1)

          old='''function monitorViewer(){clearInterval(monitor);monitor=setInterval(()=>{if(!dialog?.open){clearInterval(monitor);monitor=0;return}const s=sig();if(s!==lastSig)scheduleRefresh(90)},1200)}'''
          new='''function monitorViewer(){clearInterval(monitor);monitor=setInterval(()=>{if(!dialog?.open){clearInterval(monitor);monitor=0;return}const doc=frame?.contentDocument;if(pendingRefresh&&!doc?.querySelector("#storyMode.open,#lightbox.open")){scheduleRefresh(40);return}const s=sig();if(s!==lastSig)scheduleRefresh(180)},700)}'''
          if old not in s:
              raise SystemExit('monitor target not found')
          s=s.replace(old,new,1)

          old='''function handleState(){archiveReplacedEvidence();patch();if(dialog?.open)scheduleRefresh(120)}'''
          new='''function handleState(){archiveReplacedEvidence();patch();if(dialog?.open)scheduleRefresh(280)}'''
          if old not in s:
              raise SystemExit('handleState target not found')
          s=s.replace(old,new,1)

          old='''window.KP_ALBUM_NEXT={version:VERSION,multiPhoto:true,open,add:openAdd,html,download,print,share,photoCount:count,archiveReplacedEvidence,eventDrivenRefresh:true,serializedRefresh:true,printRefreshLock:true,protectedEvidenceProjection:true,scrollIntentProtocol:true}}'''
          new='''window.KP_ALBUM_NEXT={version:VERSION,multiPhoto:true,open,add:openAdd,html,download,print,share,photoCount:count,archiveReplacedEvidence,eventDrivenRefresh:true,serializedRefresh:true,printRefreshLock:true,protectedEvidenceProjection:true,scrollIntentProtocol:true,canonicalStateSignature:true,deferredOverlayRefresh:true}}'''
          if old not in s:
              raise SystemExit('flags target not found')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
          node --check Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-next.js
          grep -q 'canonicalStateSignature:true' Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-next.js
          grep -q 'deferredOverlayRefresh:true' Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-next.js
          grep -q 'sort((x,y)=>canonId' Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-next.js
      - name: Commit refresh fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-next.js
          git commit -m "Deduplicate Safari album refresh lifecycle"
          git push origin HEAD:main
