name: Patch Krakow Pocket R4 stability expectation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-app-sync-core.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-r4-stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align current stability revision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/krakow-album-v5-final-audit-r4.mjs')
          s=p.read_text()
          old="window.KP_STABILITY?.albumIframeGuardRevision==='20260812b'"
          new="window.KP_STABILITY?.albumIframeGuardRevision==='20260812c'&&window.KP_STABILITY?.albumUserScrollCancelsRestore===true"
          if old not in s:
              raise SystemExit('R4 stability target not found')
          p.write_text(s.replace(old,new))
          PY
          node --check .github/scripts/krakow-album-v5-final-audit-r4.mjs
          grep -q "albumIframeGuardRevision==='20260812c'" .github/scripts/krakow-album-v5-final-audit-r4.mjs
          grep -q 'albumUserScrollCancelsRestore===true' .github/scripts/krakow-album-v5-final-audit-r4.mjs
      - name: Commit aligned audit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/scripts/krakow-album-v5-final-audit-r4.mjs
          git commit -m "Align R4 audit with Safari stability 3.3"
          git push origin HEAD:main
