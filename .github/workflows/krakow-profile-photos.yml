name: Krakow Pocket profile photo audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  profile-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static profile photo checks
        run: |
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          node --check "$APP_DIR/profile-photo.js"
          node --check "$APP_DIR/state-bridge.js"
          node --check .github/scripts/krakow-profile-photos.mjs
          grep -q 'sharedViaAdventureState: true' "$APP_DIR/profile-photo.js"
          grep -q 'sharedProfilePhotos: true' "$APP_DIR/state-bridge.js"
          grep -q 'profile-photo.js' "$APP_DIR/sw.js"
          grep -q 'krakow-pocket-v24-profile-photos-20260811d' "$APP_DIR/sw.js"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 >/tmp/npm-playwright.log 2>&1
          npx playwright install --with-deps chromium webkit >/tmp/playwright-install.log 2>&1
      - name: Start local app
        run: |
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$APP_DIR" >/tmp/krakow-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4173/profile-photo.js | grep -q 'optimizedAvatar: true'
      - name: Test upload persistence and shared merge locally
        run: node .github/scripts/krakow-profile-photos.mjs
      - name: Wait for Cloudflare profile build
        run: |
          for i in {1..45}; do
            PHOTO=0; BRIDGE=0; CACHE=0
            curl -fsS https://krakow-pocket.pages.dev/profile-photo.js | grep -q 'sharedViaAdventureState: true' && PHOTO=1 || true
            curl -fsS https://krakow-pocket.pages.dev/state-bridge.js | grep -q 'sharedProfilePhotos: true' && BRIDGE=1 || true
            curl -fsS https://krakow-pocket.pages.dev/sw.js | grep -q 'krakow-pocket-v24-profile-photos-20260811d' && CACHE=1 || true
            if [ "$PHOTO" = "1" ] && [ "$BRIDGE" = "1" ] && [ "$CACHE" = "1" ]; then
              echo "Cloudflare profile photo build is live"
              exit 0
            fi
            sleep 4
          done
          exit 1
      - name: Test upload persistence and shared merge on Cloudflare
        env:
          KP_AUDIT_URL: https://krakow-pocket.pages.dev/
        run: node .github/scripts/krakow-profile-photos.mjs
