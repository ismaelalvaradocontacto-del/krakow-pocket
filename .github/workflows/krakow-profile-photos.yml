name: Krakow Pocket profile runtime audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  profile-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Static profile runtime checks
        run: |
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          node --check "$APP_DIR/compat.js"
          node --check "$APP_DIR/profile-photo.js"
          node --check "$APP_DIR/default-profile.js"
          node --check "$APP_DIR/player-stability.js"
          node --check "$APP_DIR/portrait-stability.js"
          node --check "$APP_DIR/state-bridge.js"
          node --check .github/scripts/krakow-profile-photos.mjs
          node --check .github/scripts/krakow-default-profile.mjs
          grep -q 'nativeDefaultAvatar:true' "$APP_DIR/compat.js"
          grep -q 'noGlobalMutationObserver:true' "$APP_DIR/compat.js"
          grep -q 'eventDriven:true' "$APP_DIR/profile-photo.js"
          grep -q 'noPollingLoop:true' "$APP_DIR/profile-photo.js"
          grep -q 'version: "1.4"' "$APP_DIR/state-bridge.js"
          grep -q 'profile-photo.js?v=20260811f' "$APP_DIR/state-bridge.js"
          grep -q 'krakow-pocket-v31-native-profile-safari-20260811a' "$APP_DIR/sw.js"
          if grep -q 'new MutationObserver' "$APP_DIR/compat.js" "$APP_DIR/profile-photo.js" "$APP_DIR/default-profile.js" "$APP_DIR/player-stability.js" "$APP_DIR/portrait-stability.js"; then
            echo "Profile runtime must not instantiate MutationObserver"
            exit 1
          fi
          if grep -q 'default-profile.js?v=' "$APP_DIR/state-bridge.js" || grep -q 'player-stability.js?v=' "$APP_DIR/state-bridge.js"; then
            echo "Retired profile repaint layers must not be loaded"
            exit 1
          fi

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 >/tmp/npm-playwright.log 2>&1
          npx playwright install --with-deps chromium webkit >/tmp/playwright-install.log 2>&1

      - name: Start local app
        run: |
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$APP_DIR" >/tmp/krakow-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4173/compat.js | grep -q 'nativeDefaultAvatar:true'
          curl -fsS http://127.0.0.1:4173/profile-photo.js | grep -q 'eventDriven:true'

      - name: Test profile photos locally
        run: node .github/scripts/krakow-profile-photos.mjs

      - name: Test native default and settings locally
        run: node .github/scripts/krakow-default-profile.mjs

      - name: Wait for Netlify deployment
        run: |
          for i in {1..60}; do
            COMPAT=0; PHOTO=0; BRIDGE=0; CACHE=0
            curl -fsS https://lambent-cupcake-945384.netlify.app/compat.js | grep -q 'nativeDefaultAvatar:true' && COMPAT=1 || true
            curl -fsS https://lambent-cupcake-945384.netlify.app/profile-photo.js | grep -q 'eventDriven:true' && PHOTO=1 || true
            curl -fsS https://lambent-cupcake-945384.netlify.app/state-bridge.js | grep -q 'profile-photo.js?v=20260811f' && BRIDGE=1 || true
            curl -fsS https://lambent-cupcake-945384.netlify.app/sw.js | grep -q 'krakow-pocket-v31-native-profile-safari-20260811a' && CACHE=1 || true
            if [ "$COMPAT" = "1" ] && [ "$PHOTO" = "1" ] && [ "$BRIDGE" = "1" ] && [ "$CACHE" = "1" ]; then
              echo "Netlify native profile build is live"
              exit 0
            fi
            sleep 5
          done
          echo "Netlify deployment did not update in time"
          exit 1

      - name: Test profile photos on Netlify
        env:
          KP_AUDIT_URL: https://lambent-cupcake-945384.netlify.app/
        run: node .github/scripts/krakow-profile-photos.mjs

      - name: Test native default and settings on Netlify
        env:
          KP_AUDIT_URL: https://lambent-cupcake-945384.netlify.app/
        run: node .github/scripts/krakow-default-profile.mjs
