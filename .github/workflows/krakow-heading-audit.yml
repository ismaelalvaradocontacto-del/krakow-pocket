name: Krakow Pocket heading audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  heading:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static heading checks
        run: |
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          node --check "$APP_DIR/auto-heading.js"
          node --check .github/scripts/krakow-heading.mjs
          grep -q 'staleProtection:true' "$APP_DIR/auto-heading.js"
          grep -q 'highAccuracyGpsCourse:true' "$APP_DIR/auto-heading.js"
          grep -q 'requestsOrientationPermission:false' "$APP_DIR/auto-heading.js"
          grep -q 'krakow-pocket-v34-heading-freshness-20260811a' "$APP_DIR/sw.js"
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0 >/tmp/npm-playwright.log 2>&1
          npx playwright install --with-deps chromium webkit >/tmp/playwright-install.log 2>&1
      - name: Start local app
        run: |
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$APP_DIR" >/tmp/krakow-http.log 2>&1 &
          sleep 2
      - name: Verify heading rotates locally
        run: node .github/scripts/krakow-heading.mjs
      - name: Wait for Cloudflare build
        run: |
          for i in {1..60}; do
            if curl -fsS https://krakow-pocket.pages.dev/auto-heading.js | grep -q 'staleProtection:true' \
              && curl -fsS https://krakow-pocket.pages.dev/sw.js | grep -q 'krakow-pocket-v34-heading-freshness-20260811a'; then
              echo "Cloudflare heading build is live"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Verify heading rotates on Cloudflare
        env:
          KP_AUDIT_URL: https://krakow-pocket.pages.dev/
        run: node .github/scripts/krakow-heading.mjs
