name: Krakow Pocket album v5 final R4

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: krakow-album-r4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  album-v5-r4:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact Album V5 build
        run: |
          set -euxo pipefail
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          node --check "$APP_DIR/album-v5.js"
          node --check "$APP_DIR/album-next.js"
          node --check "$APP_DIR/mission-proof.js"
          node --check "$APP_DIR/auschwitz-extra.js"
          node --check "$APP_DIR/state-bridge.js"
          node --check "$APP_DIR/stability.js"
          node --check "$APP_DIR/album-photo-quality.js"
          node --check .github/scripts/krakow-album-v5-final-audit-r4.mjs
          grep -q 'const VERSION="2.0"' "$APP_DIR/mission-proof.js"
          grep -q 'legacyAlbumUi:false' "$APP_DIR/mission-proof.js"
          grep -q 'legacyAlbumExporter:false' "$APP_DIR/mission-proof.js"
          grep -q 'const VERSION="2.0"' "$APP_DIR/auschwitz-extra.js"
          grep -q 'legacyAlbumExporter:false' "$APP_DIR/auschwitz-extra.js"
          grep -q 'bridgeRevision: "20260812e"' "$APP_DIR/state-bridge.js"
          grep -q 'staleMissionEvidenceSurvivesReload: true' "$APP_DIR/state-bridge.js"
          grep -q 'sharedAlbumPhotos: true' "$APP_DIR/state-bridge.js"
          grep -q 'atomicSharedFieldAdoption: true' "$APP_DIR/state-bridge.js"
          grep -q 'staleDiaryRecordProtection: true' "$APP_DIR/state-bridge.js"
          grep -q 'version: "3.3"' "$APP_DIR/stability.js"
          grep -q 'albumUserScrollCancelsRestore: true' "$APP_DIR/stability.js"
          grep -q 'albumIframeGuardRevision: "20260812c"' "$APP_DIR/stability.js"
          grep -q 'pdfWaitsForFrame:true' "$APP_DIR/album-v5.js"
          grep -q 'safariScrollRestore:true' "$APP_DIR/album-v5.js"
          grep -q 'const VERSION="6.0"' "$APP_DIR/album-next.js"
          grep -q 'multiPhoto:true' "$APP_DIR/album-next.js"
          grep -q 'verticalPhotosUncropped:true' "$APP_DIR/album-next.js"
          grep -q 'canonicalStateSignature:true' "$APP_DIR/album-next.js"
          grep -q 'deferredOverlayRefresh:true' "$APP_DIR/album-next.js"
          grep -q 'krakow-pocket-v50-album-multi-20260812a' "$APP_DIR/sw.js"
          grep -q './album-next.js' "$APP_DIR/sw.js"

      - name: Install Chromium and WebKit
        run: |
          npm install --no-save playwright@1.55.0 >/tmp/npm-playwright.log 2>&1
          npx playwright install --with-deps chromium webkit >/tmp/playwright-install.log 2>&1

      - name: Start exact local mirror
        run: |
          APP_DIR="Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$APP_DIR" >/tmp/kp-album-r4-http.log 2>&1 &
          sleep 2

      - name: Audit exact commit locally
        run: node .github/scripts/krakow-album-v5-final-audit-r4.mjs

      - name: Wait for exact Cloudflare build
        run: |
          for i in {1..60}; do
            V5=0; NEXT=0; PROOF=0; AUS=0; BRIDGE=0; STABLE=0; CACHE=0
            curl -fsS https://krakow-pocket.pages.dev/album-v5.js | grep -q 'pdfWaitsForFrame:true' && V5=1 || true
            curl -fsS https://krakow-pocket.pages.dev/album-next.js | grep -q 'canonicalStateSignature:true' && curl -fsS https://krakow-pocket.pages.dev/album-next.js | grep -q 'deferredOverlayRefresh:true' && NEXT=1 || true
            curl -fsS https://krakow-pocket.pages.dev/mission-proof.js | grep -q 'const VERSION="2.0"' && PROOF=1 || true
            curl -fsS https://krakow-pocket.pages.dev/auschwitz-extra.js | grep -q 'const VERSION="2.0"' && AUS=1 || true
            curl -fsS https://krakow-pocket.pages.dev/state-bridge.js | grep -q 'bridgeRevision: "20260812e"' && BRIDGE=1 || true
            curl -fsS https://krakow-pocket.pages.dev/stability.js | grep -q 'albumIframeGuardRevision: "20260812c"' && STABLE=1 || true
            curl -fsS https://krakow-pocket.pages.dev/sw.js | grep -q 'krakow-pocket-v50-album-multi-20260812a' && CACHE=1 || true
            if [ "$V5" = 1 ] && [ "$NEXT" = 1 ] && [ "$PROOF" = 1 ] && [ "$AUS" = 1 ] && [ "$BRIDGE" = 1 ] && [ "$STABLE" = 1 ] && [ "$CACHE" = 1 ]; then exit 0; fi
            sleep 4
          done
          exit 1

      - name: Audit exact Cloudflare build
        env:
          KP_AUDIT_URL: https://krakow-pocket.pages.dev/
        run: node .github/scripts/krakow-album-v5-final-audit-r4.mjs

      - name: Upload R4 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: album-v5-final-r4-report
          path: /tmp/album-v5-final-audit-r4.json
          if-no-files-found: ignore
