name: Harden Krakow Pocket preview WebKit audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-album-preview-r2-app.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Make forced-contamination assertion navigation-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/krakow-album-preview-audit.mjs')
          s=p.read_text()
          anchor='''function addCheck(bucket,name,ok,detail=''){\n  bucket.push({name,ok:!!ok,detail});\n  if(!ok) report.failures.push(`${name}${detail?` — ${detail}`:''}`);\n}\n'''
          helper='''function addCheck(bucket,name,ok,detail=''){\n  bucket.push({name,ok:!!ok,detail});\n  if(!ok) report.failures.push(`${name}${detail?` — ${detail}`:''}`);\n}\n\nasync function stableFrameState(frameLocator,timeout=12000){\n  const end=Date.now()+timeout; let last=null;\n  while(Date.now()<end){\n    try{\n      await frameLocator.locator('[data-kp-album-v5="1"]').waitFor({state:'attached',timeout:900});\n      const value=await frameLocator.locator('html').evaluate(()=>({album:!!document.querySelector('[data-kp-album-v5="1"]'),book:!!document.querySelector('.book'),app:!!document.querySelector('.app'),bottom:!!document.querySelector('nav.bottom'),url:location.href}));\n      if(value.album&&value.book&&!value.app&&!value.bottom)return value;\n      last=value;\n    }catch(e){\n      const text=String(e);\n      if(!/Execution context was destroyed|Frame was detached|navigation|Target page/i.test(text))throw e;\n      last={transition:text.slice(0,180)};\n    }\n    await new Promise(r=>setTimeout(r,120));\n  }\n  throw new Error(`iframe did not stabilize as album: ${JSON.stringify(last)}`);\n}\n'''
          if anchor not in s: raise SystemExit('addCheck anchor missing')
          s=s.replace(anchor,helper,1)
          old='''    await page.evaluate(()=>{const x=document.getElementById('kpAlbumV5Frame');x.removeAttribute('srcdoc');x.src='./'});\n    await f.locator('[data-kp-album-v5="1"]').waitFor({state:'attached',timeout:12000});await page.waitForTimeout(500);\n    const repaired=await f.locator('html').evaluate(()=>({album:!!document.querySelector('[data-kp-album-v5="1"]'),book:!!document.querySelector('.book'),app:!!document.querySelector('.app'),bottom:!!document.querySelector('nav.bottom'),url:location.href}));\n    addCheck(checks,`${engineName}: contaminated iframe self-repairs to album`,repaired.album&&repaired.book&&!repaired.app&&!repaired.bottom,JSON.stringify(repaired));'''
          new='''    await page.evaluate(()=>{const x=document.getElementById('kpAlbumV5Frame');x.removeAttribute('srcdoc');x.src='./'});\n    const repaired=await stableFrameState(f,12000);\n    addCheck(checks,`${engineName}: contaminated iframe self-repairs to album`,repaired.album&&repaired.book&&!repaired.app&&!repaired.bottom,JSON.stringify(repaired));'''
          if old not in s: raise SystemExit('forced-contamination block missing')
          p.write_text(s.replace(old,new,1))
          PY
          node --check .github/scripts/krakow-album-preview-audit.mjs
          grep -q 'stableFrameState' .github/scripts/krakow-album-preview-audit.mjs
      - name: Commit audit hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/scripts/krakow-album-preview-audit.mjs
          git commit -m 'Make WebKit album self-repair audit navigation-safe'
          git push origin HEAD:main
