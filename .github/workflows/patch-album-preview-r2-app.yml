name: Finish Krakow Pocket completed mission photo replacement
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-album-preview-r2-app.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fix replacement labels and archive race
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2')

          # The mission management adapter was repainting completed quest buttons as "Desmarcar".
          p=root/'enhancements.js';s=p.read_text()
          old='''document.querySelectorAll(".q-done[data-poi]").forEach(b=>{const isDone=effective(s,b.dataset.poi);b.textContent=isDone?"↩ Desmarcar":"✓ Completar";b.classList.toggle("green",!isDone);b.classList.toggle("secondary",isDone);b.closest(".quest")?.classList.toggle("done",isDone)})'''
          new='''document.querySelectorAll(".q-done[data-poi]").forEach(b=>{const isDone=effective(s,b.dataset.poi);b.textContent=isDone?"📷 Cambiar foto":"✓ Completar";b.classList.toggle("green",!isDone);b.classList.toggle("secondary",isDone);b.closest(".quest")?.classList.toggle("done",isDone)})'''
          if old not in s: raise SystemExit('enhancements renderMissionControls label anchor missing')
          s=s.replace(old,new,1)
          old='''document.addEventListener("click",e=>{const b=e.target.closest?.(".q-done[data-poi]");if(!b)return;e.preventDefault();e.stopImmediatePropagation();const s=normalize(read()),id=b.dataset.poi,isDone=effective(s,id),q=D.quests.find(x=>x.poi===id);change([id],!isDone,isDone?`↩ ${q?.title||"Misión"} vuelve a estar pendiente`:`✓ ${q?.title||"Misión"} completada`)},true);'''
          new='''document.addEventListener("click",e=>{const b=e.target.closest?.(".q-done[data-poi]");if(!b)return;const s=normalize(read()),id=b.dataset.poi,isDone=effective(s,id);if(isDone){const proof=s.missionEvidence?.[id],api=window.KP_MISSION_PROOF;if(proof?.verified===true&&typeof proof.photo==="string"&&proof.photo.startsWith("data:image/")&&api?.replaceCompletedPhoto&&typeof api.open==="function"){e.preventDefault();e.stopImmediatePropagation();api.open(id,{replace:true});return}return}e.preventDefault();e.stopImmediatePropagation();const q=D.quests.find(x=>x.poi===id);change([id],true,`✓ ${q?.title||"Misión"} completada`)},true);'''
          if old not in s: raise SystemExit('enhancements q-done click anchor missing')
          s=s.replace(old,new,1).replace('window.KP_ENHANCEMENTS={version:"7.0",reloadFree:true};','window.KP_ENHANCEMENTS={version:"7.1",reloadFree:true,completedMissionPhotoReplacement:true};',1)
          p.write_text(s)

          # The pixel/story UI must describe the same action instead of suggesting an undo.
          p=root/'mission-fix.js';s=p.read_text()
          s=s.replace('const label = done ? "↩ Desmarcar" : "Completar";','const label = done ? "📷 Cambiar foto" : "Completar";',1)
          old='''    const done = qIds.has(id) ? isDone(s, id) : discovered(s, id);\n    const label = done ? "↩ Desmarcar descubierto" : "✨ Marcar descubierto";'''
          new='''    const done = qIds.has(id) ? isDone(s, id) : discovered(s, id);\n    const label = qIds.has(id) && done ? "📷 Cambiar foto" : (done ? "↩ Desmarcar descubierto" : "✨ Marcar descubierto");'''
          if old not in s: raise SystemExit('mission-fix story label anchor missing')
          s=s.replace(old,new,1).replace('window.KP_MISSION_UX = { version: "4.2", stateHooks: false, networkHooks: false };','window.KP_MISSION_UX = { version: "4.3", stateHooks: false, networkHooks: false, completedMissionPhotoReplacement: true };',1)
          p.write_text(s)

          # Replacement is marked on the evidence itself. This closes the race where storage/state events
          # can arrive before the custom event carrying replaceOnly metadata.
          p=root/'album-next.js';s=p.read_text()
          old='''  if(skipId&&id===skipId)continue;\n  const fresh=current[id];if(!old?.photo||!fresh?.photo||photoHash(old.photo)===photoHash(fresh.photo))continue;'''
          new='''  const fresh=current[id];\n  if(skipId&&id===skipId)continue;\n  if(fresh?.replacedAt&&stamp(fresh)>=stamp(old)){continue}\n  if(!old?.photo||!fresh?.photo||photoHash(old.photo)===photoHash(fresh.photo))continue;'''
          if old not in s: raise SystemExit('album replacement archive anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('controllerRevision:"20260813b"','controllerRevision:"20260813c"',1)
          s=s.replace('intentionalReplacementSkipsArchive:true,eventDrivenRefresh:true','intentionalReplacementSkipsArchive:true,replacementArchiveGuardByEntry:true,eventDrivenRefresh:true',1)
          p.write_text(s)

          p=root/'sw.js';s=p.read_text()
          if 'krakow-pocket-v64-photo-replace-20260813a' not in s: raise SystemExit('service worker v64 anchor missing')
          p.write_text(s.replace('krakow-pocket-v64-photo-replace-20260813a','krakow-pocket-v65-photo-replace-20260813b',1))
          PY
          APP='Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2'
          node --check "$APP/enhancements.js"
          node --check "$APP/mission-fix.js"
          node --check "$APP/album-next.js"
          node --check "$APP/sw.js"
          grep -q 'version:"7.1"' "$APP/enhancements.js"
          grep -q 'completedMissionPhotoReplacement:true' "$APP/enhancements.js"
          grep -q '📷 Cambiar foto' "$APP/enhancements.js"
          grep -q 'version: "4.3"' "$APP/mission-fix.js"
          grep -q 'replacementArchiveGuardByEntry:true' "$APP/album-next.js"
          grep -q 'controllerRevision:"20260813c"' "$APP/album-next.js"
          grep -q 'krakow-pocket-v65-photo-replace-20260813b' "$APP/sw.js"
      - name: Commit final replacement fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/enhancements.js Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/mission-fix.js Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-next.js Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/sw.js
          git commit -m 'Finish completed mission photo replacement UX'
          git push origin HEAD:main
