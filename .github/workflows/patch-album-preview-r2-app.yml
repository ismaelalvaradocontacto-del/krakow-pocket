name: Compact Krakow Pocket album preview action bar
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-album-preview-r2-app.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Compact mobile preview footer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-next.js')
          s=p.read_text()
          old='''@media(max-width:430px){#kpAlbumV5Card .kp-v5-buttons{grid-template-columns:1fr!important}#kpAlbumV6Add{grid-column:auto}#kpAlbumV5Dialog .kp-v5-shell>footer{grid-template-columns:repeat(2,1fr)!important;gap:6px!important}#kpAlbumV5Dialog .kp-v5-shell>footer button{min-height:44px!important;font-size:12px!important;padding:7px 5px!important}.kp-v5-shell>header strong{font-size:16px!important}}'''
          new='''@media(max-width:430px){#kpAlbumV5Card .kp-v5-buttons{grid-template-columns:1fr!important}#kpAlbumV6Add{grid-column:auto}#kpAlbumV5Dialog .kp-v5-shell>footer{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:4px!important;padding:7px 6px calc(7px + env(safe-area-inset-bottom))!important}#kpAlbumV5Dialog .kp-v5-shell>footer button{min-height:44px!important;font-size:11px!important;padding:6px 2px!important;line-height:1.05!important;white-space:nowrap!important}.kp-v5-shell>header strong{font-size:16px!important}}'''
          if old not in s: raise SystemExit('mobile 2x2 footer target missing')
          s=s.replace(old,new,1).replace('controllerRevision:"20260813a"','controllerRevision:"20260813b"',1)
          p.write_text(s)
          PY
          APP='Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-next.js'
          node --check "$APP"
          grep -q 'repeat(4,minmax(0,1fr))' "$APP"
          grep -q 'controllerRevision:"20260813b"' "$APP"
      - name: Commit compact preview footer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Krakow_Pocket_iOS_PRO_AUTO_FIX2/Krakow_Pocket_iOS_PRO_AUTO_FIX2/album-next.js
          git commit -m 'Compact mobile album preview actions'
          git push origin HEAD:main
